<!DOCTYPE html>
<html lang="{{ page.lang | default: 'de' }}">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% if page.meta_title %}{{ page.meta_title }}{% else %}{{ page.title }} – K4 Endurance{% endif %}</title>

    <meta name="description" content="{% if page.meta_description %}{{ page.meta_description }}{% else %}{{ site.description }}{% endif %}">

    <link rel="canonical" href="{{ page.url | absolute_url }}">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

</head>

<body>

{{ content }}

<script src="{{ '/assets/js/main.js' | relative_url }}"></script>

</body>
</html>
