media:
  input: assets/images
  output: /assets/images

content:
  - name: posts
    label: "Blog-Artikel"
    type: collection
    path: '_posts'
    filename: '{year}-{month}-{day}-{fields.slug}.md'
    view:
      fields: [title, date, lang, category]
    fields:
      - { name: date, label: "Datum", type: date }
      - { name: title, label: "Titel", type: string }
      - { name: slug, label: "URL-Kürzel (ohne Leerzeichen, z.B. mein-erster-post)", type: string }
      - { name: page_id, label: "Page ID (gleich für DE+EN Versionen)", type: string }
      - name: lang
        label: "Sprache"
        type: select
        options:
          values:
            - { value: "de", label: "Deutsch" }
            - { value: "en", label: "English" }
      - name: category
        label: "Kategorie"
        type: select
        options:
          values: ["Training", "Ernährung", "Mentale Stärke", "Material", "Sonstiges"]
      - { name: author, label: "Autor", type: string }
      - { name: image, label: "Titelbild", type: image }
      - { name: excerpt, label: "Kurzbeschreibung (für Übersicht)", type: text }
      - { name: body, label: "Artikeltext", type: rich-text }

  - name: tools-de
    label: "Tools (Deutsch)"
    type: collection
    path: '_tools/de'
    filename: '{fields.slug}.md'
    view:
      fields: [title, status, order]
    fields:
      - { name: title, label: "Titel", type: string, required: true }
      - { name: slug, label: "URL-Kürzel (ohne Leerzeichen, z.B. plyometrics-rechner)", type: string, required: true }
      - { name: page_id, label: "Page ID (gleich für DE+EN-Version, verknüpft den Sprachumschalter)", type: string }
      - { name: description, label: "Kurzbeschreibung (Übersicht + Kopfbereich)", type: text }
      - { name: icon, label: "Icon (Material-Symbol-Name, z.B. bolt, calculate, timer)", type: string, default: "calculate" }
      - name: status
        label: "Status"
        type: select
        default: "live"
        options:
          values:
            - { value: "live", label: "Veröffentlicht" }
            - { value: "soon", label: "Bald verfügbar (Karte ohne Link)" }
      - { name: order, label: "Reihenfolge in der Übersicht (1 = zuerst)", type: number, default: 10 }
      - name: widget
        label: "Rechner (Programmlogik)"
        type: select
        default: "none"
        options:
          values:
            - { value: "plyometrics", label: "Plyometrics Session Rechner" }
            - { value: "none", label: "Kein Rechner (nur Text)" }
      - { name: meta_title, label: "SEO-Titel (optional)", type: string }
      - { name: meta_description, label: "SEO-Beschreibung (optional)", type: text }
      - { name: body, label: "Erklärung & Hintergrund (unter dem Rechner)", type: rich-text }

  - name: tools-en
    label: "Tools (English)"
    type: collection
    path: '_tools/en'
    filename: '{fields.slug}.md'
    view:
      fields: [title, status, order]
    fields:
      - { name: title, label: "Titel", type: string, required: true }
      - { name: slug, label: "URL-Kürzel (ohne Leerzeichen, z.B. plyometrics-rechner)", type: string, required: true }
      - { name: page_id, label: "Page ID (gleich für DE+EN-Version, verknüpft den Sprachumschalter)", type: string }
      - { name: description, label: "Kurzbeschreibung (Übersicht + Kopfbereich)", type: text }
      - { name: icon, label: "Icon (Material-Symbol-Name, z.B. bolt, calculate, timer)", type: string, default: "calculate" }
      - name: status
        label: "Status"
        type: select
        default: "live"
        options:
          values:
            - { value: "live", label: "Veröffentlicht" }
            - { value: "soon", label: "Bald verfügbar (Karte ohne Link)" }
      - { name: order, label: "Reihenfolge in der Übersicht (1 = zuerst)", type: number, default: 10 }
      - name: widget
        label: "Rechner (Programmlogik)"
        type: select
        default: "none"
        options:
          values:
            - { value: "plyometrics", label: "Plyometrics Session Rechner" }
            - { value: "none", label: "Kein Rechner (nur Text)" }
      - { name: meta_title, label: "SEO-Titel (optional)", type: string }
      - { name: meta_description, label: "SEO-Beschreibung (optional)", type: text }
      - { name: body, label: "Erklärung & Hintergrund (unter dem Rechner)", type: rich-text }

  - name: logic-plyometrics
    label: "Rechner-Logik: Plyometrics"
    type: file
    path: '_data/tools/plyometrics.yml'
    format: yaml
    fields:
      - { name: default_reps, label: "Voreingestellte Anzahl Sprünge pro neuer Zeile", type: number, default: 10 }
      - name: exercises
        label: "Übungen & Gewichtungsfaktoren (gilt für DE und EN)"
        type: object
        list:
          collapsible:
            summary: "{name} (×{factor})"
        fields:
          - { name: name, label: "Übung", type: string, required: true }
          - { name: factor, label: "Gewichtungsfaktor (Depth Jump 15 = 1,0)", type: number, required: true, options: { step: 0.01 } }
