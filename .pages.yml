media:
  input: assets/images
  output: /assets/images

content:
  - name: posts-de
    label: "Blog (Deutsch)"
    type: collection
    path: '_posts/de'
    filename: '{year}-{month}-{day}-{fields.slug}.md'
    view:
      fields: [title, date, category]
    fields:
      - { name: date, label: "Datum", type: date }
      - { name: title, label: "Titel", type: string }
      - { name: slug, label: "URL-Kürzel (ohne Leerzeichen, z.B. mein-erster-post)", type: string }
      - { name: page_id, label: "Page ID (gleich für DE+EN-Version, verknüpft den Sprachumschalter)", type: string }
      - name: category
        label: "Kategorie"
        type: select
        options:
          values: ["Training", "Ernährung", "Mentale Stärke", "Material", "Sonstiges"]
      - { name: author, label: "Autor", type: string }
      - name: image
        label: "Titelbild"
        description: "Hochladen in 1920 × 1080 px (16:9), WebP oder JPEG, max. ca. 300 KB. Hauptmotiv mittig platzieren – auf dem Desktop werden oben und unten je ca. 8 % abgeschnitten. Ordner: blog. Kleinere Versionen fürs Handy werden automatisch erzeugt."
        type: image
      - { name: excerpt, label: "Kurzbeschreibung (für Übersicht)", type: text }
      - name: body
        label: "Artikeltext"
        description: "Bilder im Text: 1600 px breit hochladen (Querformat 3:2 oder 16:9 empfohlen), WebP oder JPEG, max. ca. 200 KB. Ordner: blog."
        type: rich-text

  - name: posts-en
    label: "Blog (English)"
    type: collection
    path: '_posts/en'
    filename: '{year}-{month}-{day}-{fields.slug}.md'
    view:
      fields: [title, date, category]
    fields:
      - { name: date, label: "Datum", type: date }
      - { name: title, label: "Titel", type: string }
      - { name: slug, label: "URL-Kürzel (ohne Leerzeichen, z.B. mein-erster-post)", type: string }
      - { name: page_id, label: "Page ID (gleich für DE+EN-Version, verknüpft den Sprachumschalter)", type: string }
      - name: category
        label: "Kategorie"
        type: select
        options:
          values: ["Training", "Ernährung", "Mentale Stärke", "Material", "Sonstiges"]
      - { name: author, label: "Autor", type: string }
      - name: image
        label: "Titelbild"
        description: "Hochladen in 1920 × 1080 px (16:9), WebP oder JPEG, max. ca. 300 KB. Hauptmotiv mittig platzieren – auf dem Desktop werden oben und unten je ca. 8 % abgeschnitten. Ordner: blog. Kleinere Versionen fürs Handy werden automatisch erzeugt."
        type: image
      - { name: excerpt, label: "Kurzbeschreibung (für Übersicht)", type: text }
      - name: body
        label: "Artikeltext"
        description: "Bilder im Text: 1600 px breit hochladen (Querformat 3:2 oder 16:9 empfohlen), WebP oder JPEG, max. ca. 200 KB. Ordner: blog."
        type: rich-text

  - name: tools-de
    label: "Tools (Deutsch)"
    type: collection
    path: '_tools/de'
    filename: '{fields.slug}.md'
    view:
      fields: [title, status, order]
    fields:
      - { name: title, label: "Titel", type: string, required: true }
      - { name: slug, label: "URL-Kürzel (ohne Leerzeichen, z.B. plyometrics-rechner)", type: string, required: true }
      - { name: page_id, label: "Page ID (gleich für DE+EN-Version, verknüpft den Sprachumschalter)", type: string }
      - { name: description, label: "Kurzbeschreibung (Übersicht + Kopfbereich)", type: text }
      - { name: icon, label: "Icon (Material-Symbol-Name, z.B. bolt, calculate, timer)", type: string, default: "calculate" }
      - name: status
        label: "Status"
        type: select
        default: "live"
        options:
          values:
            - { value: "live", label: "Veröffentlicht" }
            - { value: "soon", label: "Bald verfügbar (Karte ohne Link)" }
      - { name: order, label: "Reihenfolge in der Übersicht (1 = zuerst)", type: number, default: 10 }
      - name: code
        label: "Widget-Code (HTML, CSS & JavaScript)"
        description: "Kompletter Code des Rechners. Wird 1:1 auf der Seite eingefügt. Tipp: in ein Element mit class=\"tool-widget\" packen, dann passt der Rahmen zum Seitendesign."
        type: code
        options: { format: html }
      - { name: meta_title, label: "SEO-Titel (optional)", type: string }
      - { name: meta_description, label: "SEO-Beschreibung (optional)", type: text }
      - { name: body, label: "Erklärung & Hintergrund (unter dem Rechner)", type: rich-text }

  - name: tools-en
    label: "Tools (English)"
    type: collection
    path: '_tools/en'
    filename: '{fields.slug}.md'
    view:
      fields: [title, status, order]
    fields:
      - { name: title, label: "Titel", type: string, required: true }
      - { name: slug, label: "URL-Kürzel (ohne Leerzeichen, z.B. plyometrics-rechner)", type: string, required: true }
      - { name: page_id, label: "Page ID (gleich für DE+EN-Version, verknüpft den Sprachumschalter)", type: string }
      - { name: description, label: "Kurzbeschreibung (Übersicht + Kopfbereich)", type: text }
      - { name: icon, label: "Icon (Material-Symbol-Name, z.B. bolt, calculate, timer)", type: string, default: "calculate" }
      - name: status
        label: "Status"
        type: select
        default: "live"
        options:
          values:
            - { value: "live", label: "Veröffentlicht" }
            - { value: "soon", label: "Bald verfügbar (Karte ohne Link)" }
      - { name: order, label: "Reihenfolge in der Übersicht (1 = zuerst)", type: number, default: 10 }
      - name: code
        label: "Widget-Code (HTML, CSS & JavaScript)"
        description: "Kompletter Code des Rechners. Wird 1:1 auf der Seite eingefügt. Tipp: in ein Element mit class=\"tool-widget\" packen, dann passt der Rahmen zum Seitendesign."
        type: code
        options: { format: html }
      - { name: meta_title, label: "SEO-Titel (optional)", type: string }
      - { name: meta_description, label: "SEO-Beschreibung (optional)", type: text }
      - { name: body, label: "Erklärung & Hintergrund (unter dem Rechner)", type: rich-text }
