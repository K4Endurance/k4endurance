title: K4 Endurance
description: Individuelles Trail- und Ultrarunning-Coaching mit K4 Endurance.
url: "https://www.k4endurance.com"

include:
  - _data

markdown: kramdown

# Blog-Einstellungen
plugins:
  - jekyll-paginate
permalink: /blog/:year/:month/:day/:title/
future: true

# Tools & Rechner (gepflegt über PagesCMS: "Tools (Deutsch)" / "Tools (English)")
collections:
  tools:
    output: true

defaults:
  - scope:
      path: "en"
    values:
      lang: "en"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      lang: "de"
  - scope:
      path: "_tools/de"
      type: "tools"
    values:
      layout: "tool"
      lang: "de"
      permalink: /tools/:name/
  - scope:
      path: "_tools/en"
      type: "tools"
    values:
      layout: "tool"
      lang: "en"
      permalink: /en/tools/:name/
