name: Bildvarianten erzeugen

# Läuft, sobald neue Blog-Bilder (z. B. über PagesCMS) hochgeladen werden.
on:
  push:
    branches: [main]
    paths:
      - "assets/images/blog/**"
      - ".github/scripts/resize_images.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: resize-images
  cancel-in-progress: false

jobs:
  resize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python .github/scripts/resize_images.py
      - name: Varianten committen
        run: |
          if [ ! -d assets/images/resized ]; then
            echo "Keine Bilder in assets/images/blog – nichts zu tun."
            exit 0
          fi
          git add assets/images/resized
          if git diff --cached --quiet; then
            echo "Keine neuen Varianten."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "Bildvarianten für srcset erzeugen"
          git pull --rebase
          git push
